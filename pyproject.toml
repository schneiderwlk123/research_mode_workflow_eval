[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "full-trace-audit"
version = "0.1.0"
description = "面向 Agent 与 RAG 工作流的全链路评测框架"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
oss = [
  "oss2>=2.18",
  "openpyxl>=3.1",
]
embedding = [
  "sentence-transformers>=3,<4",
]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

# oss2 与 openpyxl 无官方类型存根,忽略其导入类型检查
[[tool.mypy.overrides]]
module = ["oss2.*", "openpyxl.*"]
ignore_missing_imports = true
